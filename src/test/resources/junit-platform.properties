# Parallel execution is enabled, but the tests run in the same thread by default: only the classes annotated
# @Execution(CONCURRENT) (JarFileToJavaSourceTest, one jar per method) run their methods concurrently
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
