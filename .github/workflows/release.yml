name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, for the commit list in the release notes
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches project version
        run: |
          PROJECT_VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')
          if [ "v${PROJECT_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match build.gradle version ${PROJECT_VERSION}"
            exit 1
          fi

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Write release notes
        run: |
          # Hand-written notes take precedence: .github/release-notes/<tag>.md
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "${NOTES_FILE}" ]; then
            cp "${NOTES_FILE}" release-notes.md
            cat release-notes.md
            exit 0
          fi

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "${PREVIOUS_TAG}" ]; then
              git log --no-merges --format='- %s (%h)' "${PREVIOUS_TAG}..${GITHUB_REF_NAME}"
            else
              # First release of this repository (no previous tag): last 30 commits
              git log --no-merges --format='- %s (%h)' -n 30 "${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: JD-Core ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            build/libs/jd-core-*.jar
