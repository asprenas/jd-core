plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

group = 'org.jd'
version = '1.3.4'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'commons-codec:commons-codec:1.13'
    testImplementation 'org.apache.commons:commons-collections4:4.1'
    testImplementation 'org.apache.commons:commons-imaging:1.0-alpha1'
    testImplementation 'org.apache.commons:commons-lang3:3.9'
    testImplementation 'com.jakewharton:disklrucache:2.0.2'
    testImplementation 'com.squareup:javapoet:1.11.1'
    testImplementation 'com.squareup:javawriter:2.5.1'
    testImplementation 'joda-time:joda-time:2.10.5'
    testImplementation 'org.joda:joda-convert:2.2.1'
    testImplementation 'org.jsoup:jsoup:1.12.1'
    // Decompilation fixture for JarFileToJavaSourceTest.testJUnit4 (disabled, see TODO there)
    //testImplementation 'junit:junit:4.12'
    testImplementation 'javax.jms:javax.jms-api:2.0.1'
    testImplementation 'javax.mail:javax.mail-api:1.6.2'
    testImplementation 'com.squareup.mimecraft:mimecraft:1.1.1'
    testImplementation 'org.scribe:scribe:1.3.7'
    testImplementation 'com.sparkjava:spark-core:2.9.1'
    testImplementation 'log4j:log4j:1.2.17'
    testImplementation 'com.google.guava:guava:12.0'
    // Recompilation of junit-jupiter-api (JarFileToJavaSourceTest.testJUnit5): annotations of its API
    testImplementation 'org.apiguardian:apiguardian-api:1.1.2'
    testImplementation 'org.jspecify:jspecify:1.0.0'
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-Xlint:unchecked'
    // Hides 'source value 8 is obsolete and will be removed in a future release' (JDK 21+): when a JDK removes
    // '--release 8', the library build needs an older JDK (toolchain) or a newer release
    options.compilerArgs << '-Xlint:-options'
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    // Library bytecode stays Java 8 compatible for the applications using jd-core
    options.release = 8
}

tasks.named('compileTestJava') {
    // Tests are not published: Java 17, the minimum JDK of Gradle 9
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    // JarFileToJavaSourceTest decompiles and recompiles several jars concurrently
    maxHeapSize = '4g'
    // JavaLanguageVersionTest is enabled by this variable: changing it must not leave the task UP-TO-DATE
    inputs.property('JDCORE_SAMPLES', System.getenv('JDCORE_SAMPLES') ?: '')
}

// Java language samples: src/test/resources/java/org/jd/core/test/java<N>/ compiled by a Temurin JDK N
// (Gradle toolchain, downloaded when missing) into src/test/resources/zip/data-java-language-<N>.zip.
// Each lower version is also compiled by the newest JDK with --release N into
// data-java-language-<N>-javac<newest>.zip (newer javac code generation for an older target).
// The zips are committed; rebuild them with ./gradlew buildJavaLanguageSamples (or zipJavaLanguage<N>Samples,
// zipJavaLanguage<N>Javac<newest>Samples).
def javaLanguageVersions = [8, 11, 17, 21, 25]
def javaLanguageNewest = javaLanguageVersions.max()
def javaLanguageZipDir = file('src/test/resources/zip')

def registerJavaLanguageSamples = { int version, int jdk ->
    def suffix = (jdk == version) ? '' : "-javac${jdk}"
    def taskSuffix = (jdk == version) ? "${version}" : "${version}Javac${jdk}"
    def zipName = "data-java-language-${version}${suffix}"

    def compileTask = tasks.register("compileJavaLanguage${taskSuffix}Samples", JavaCompile) {
        group = 'java language samples'
        description = "Compiles the Java ${version} language samples with a Temurin JDK ${jdk}."
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(jdk)
            vendor = JvmVendorSpec.ADOPTIUM
        }
        source = fileTree("src/test/resources/java/org/jd/core/test/java${version}") { include '**/*.java' }
        classpath = files()
        destinationDirectory = layout.buildDirectory.dir("java-language-version-samples/${version}${suffix}")
        // -g: line numbers and local variable names
        options.debug = true
        if (jdk == 8) {
            // javac 8 has no --release
            options.release.set((Integer) null)
            sourceCompatibility = '1.8'
            targetCompatibility = '1.8'
        } else {
            options.release = version
        }
    }

    def compiler = compileTask.flatMap { it.javaCompiler }
    def infoFile = new File(javaLanguageZipDir, "${zipName}.txt")

    tasks.register("zipJavaLanguage${taskSuffix}Samples", Zip) {
        group = 'java language samples'
        description = "Packs the Java ${version} language samples compiled by JDK ${jdk} into ${zipName}.zip."
        from compileTask
        archiveFileName = "${zipName}.zip"
        destinationDirectory = javaLanguageZipDir
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        outputs.file(infoFile)
        doLast {
            // Records which compiler produced the zip: javac output differs between JDK builds
            def metadata = compiler.get().metadata
            infoFile.text = "vendor=${metadata.vendor}\njavaRuntimeVersion=${metadata.javaRuntimeVersion}\nrelease=${version}\n"
        }
    }

    return "zipJavaLanguage${taskSuffix}Samples"
}

def javaLanguageZipTasks = []

javaLanguageVersions.each { version ->
    javaLanguageZipTasks << registerJavaLanguageSamples(version, version)
    if (version < javaLanguageNewest) {
        javaLanguageZipTasks << registerJavaLanguageSamples(version, javaLanguageNewest)
    }
}

tasks.register('buildJavaLanguageSamples') {
    group = 'java language samples'
    description = 'Rebuilds every data-java-language-<N>(-javac<newest>).zip with Temurin JDKs.'
    dependsOn javaLanguageZipTasks
}

jar {
    manifest {
        attributes 'JD-Core-Version': project.version
    }
}

publishing {
    publications {
        publicationJdCore(MavenPublication) {
            artifactId = 'jd-core'
            from components.java
        }
    }
}
